services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: taxtrace
      POSTGRES_PASSWORD: taxtrace
      POSTGRES_DB: taxtrace
    ports:
      - "5434:5432"
    volumes:
      - taxtrace_pg:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxtrace -d taxtrace"]
      interval: 3s
      timeout: 5s
      retries: 20

  web:
    build: .
    ports:
      - "8080:8000"
    environment:
      TAXTRACE_DATABASE_URL: postgresql+psycopg://taxtrace:taxtrace@postgres:5432/taxtrace
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  taxtrace_pg:
